<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CofradiUS - Rastreador GPS en Vivo</title>
    
    <!-- Google Fonts: Outfit y Cinzel -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    
    <!-- Favicon para la pestaña del navegador -->
    <link rel="icon" type="image/png" href="chincheta.png">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    
    <!-- Estilos de la aplicación -->
    <link rel="stylesheet" href="styles.css?v=2">
</head>
<body>
    <!-- Contenedor del Mapa -->
    <div id="map"></div>

    <!-- VISTA: EN VIVO -->
    <div id="live-view-container">
        <!-- Panel Flotante Glassmorphism -->
        <div id="floating-panel" class="glass-panel">
            <button id="btn-go-planner" class="tab-btn" style="width:100%; border:1px solid #8A6B31; border-radius:8px; margin-bottom:15px; background: rgba(138, 107, 49, 0.1);">Abrir Planificador</button>
            <div class="header">
                <h1 class="title">CofradiUS</h1>
                <div id="live-indicator-badge" class="live-indicator">
                    <span class="dot"></span> EN VIVO
                </div>
            </div>
            <h2 class="subtitle">Paso único</h2>
            <div class="status-container">
                <p class="status-label">Última actualización:</p>
                <p class="status"><span id="time-counter">Conectando...</span></p>
            </div>
        </div>
    </div>

    <!-- VISTA: PLANIFICADOR (Oculta por defecto) -->
    <div id="planner-view-container" class="hidden">
        <!-- AppBar Superior (Estilo Flutter) -->
        <div class="planner-appbar">
            <button id="btn-go-live" class="back-btn">⬅ Volver</button>
            <h1 class="planner-title">Planificador CofradiUS</h1>
        </div>

        <!-- Tarjeta Inferior (Estilo Flutter) -->
        <div class="planner-bottom-card">
            <!-- Selector de Hermandad -->
            <div class="hermandad-selector-container">
                <select id="hermandad-selector" class="hermandad-selector">
                    <!-- Las opciones se generarán dinámicamente desde app.js -->
                </select>
            </div>
            
            <div class="status-container" style="text-align: center;">
                <h3 class="planner-time-title">Hora de consulta: <span id="planner-time-display">--:--</span></h3>
                <input type="range" id="planner-slider" min="0" max="360" value="0" class="time-slider">
                <p class="slider-hint">Desliza para ver la posición prevista</p>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <!-- Supabase JS v2 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Script principal de la aplicación -->
    <script src="app.js?v=2"></script>
</body>
</html>
